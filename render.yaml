# Blueprint de Render: https://render.com/docs/blueprint-spec
# Los valores con `sync: false` se cargan a mano en el dashboard al crear el servicio.
services:
  - type: web
    name: mini-blog-backend
    runtime: node
    plan: free
    region: virginia # la región más cercana al proyecto de Supabase (sa-east-1) que ofrece Render
    # --include=dev: Render setea NODE_ENV=production y Strapi necesita typescript para compilar.
    # NODE_OPTIONS solo en el build (heap más amplio para Vite); el runtime queda sin límite explícito.
    buildCommand: npm ci --include=dev && NODE_OPTIONS=--max-old-space-size=460 npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    autoDeploy: true
    envVars:
      # La versión de Node sale de .nvmrc (22).
      - key: NODE_ENV
        value: production
      - key: IS_PROXIED
        value: "true"
      - key: PUBLIC_URL
        sync: false

      # Secretos de Strapi. Si reusás una base existente, pegá acá los valores de tu .env
      # (cambiar API_TOKEN_SALT invalida los API tokens ya creados).
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      # Base de datos
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      # Contenido completo del certificado CA de Supabase (PEM). Ver docs/deploy.md.
      - key: DATABASE_SSL_CA
        sync: false
      - key: DATABASE_POOL_MIN
        value: "0"
      - key: DATABASE_POOL_MAX
        value: "5"

      # Supabase Storage
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        value: sa-east-1
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: uploads
      - key: SUPABASE_PUBLIC_URL
        sync: false
